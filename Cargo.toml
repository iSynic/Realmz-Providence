[workspace]
members = [
    "crates/providence-cli",
    "crates/providence-core",
    "crates/providence-native-adapter",
    "crates/providence-application-library",
    "crates/providence-rebuilt-package",
    "crates/providence-rebuilt-preview",
    "crates/providence-storage",
    "crates/providence-session-client",
    "crates/providence-mcp",
    "crates/providence-publication",
]
resolver = "2"
exclude = ["vendor/stuffit"]

[workspace.package]
version = "0.6.0-beta.4"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
# Providence ships as an application; no crate is published to crates.io.
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
crc32fast = "1.5"
adler2 = "2.0"
base64 = "0.23"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[workspace.lints.clippy]
# Native codecs use slice chunks so record readers share one slice interface.
chunks_exact_to_as_chunks = "allow"
