name: Native builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dependencies:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Licenses, advisories, bans and sources against deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.98.0'

  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: macos-14
            platform: macos-universal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: External Cargo build directory
        id: target
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/providence-target" >> "$GITHUB_ENV"
          # rust-cache joins its target onto the workspace path, so it needs a relative one.
          echo "relative=$(python -c 'import os, sys; print(os.path.relpath(sys.argv[1]).replace(os.sep, "/"))' "$RUNNER_TEMP/providence-target")" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> ${{ steps.target.outputs.relative }}"
          key: ${{ matrix.platform }}
      - name: Public source boundary
        run: |
          python tools/release/check_public_source.py
          python tools/release/verify_source_inputs.py
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Core, storage and adapter tests
        run: cargo test --workspace --all-targets --locked
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Pinned downloads (Godot, templates, libopenmpt) are re-verified by hash on use, so
      # caching them only skips the network, including outages of the upstream hosts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/providence-cache
          key: release-downloads-${{ matrix.platform }}-${{ hashFiles('tools/release/pins.json', 'tools/music-preview-runtime.json', 'tools/release/*.py') }}
      - name: Pinned Godot editor and export templates
        run: python tools/release/bootstrap.py --cache "${{ runner.temp }}/providence-cache"
      # The smoke tier's checks call Windows PowerShell scripts, so it runs on Windows. Its preview
      # checks need the application library, derived here from the bundled reference sources.
      - name: UI smoke tier
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked -p providence-native-adapter -p providence-cli -p providence-mcp
          & $env:PROVIDENCE_GODOT_PATH --headless --path godot --editor --import
          $env:PROVIDENCE_APPLICATION_LIBRARY_ROOT = "$env:RUNNER_TEMP/smoke-library/realmz-classic"
          python tools/prepare-mcp-application-library.py --adapter "$env:CARGO_TARGET_DIR/debug/providence-native-adapter.exe" --source godot/bundled/realmz-reference --output $env:PROVIDENCE_APPLICATION_LIBRARY_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-ui-checks.py --tier smoke --godot "$env:PROVIDENCE_GODOT_PATH" --adapter "$env:CARGO_TARGET_DIR/debug/providence-native-adapter.exe" --cli "$env:CARGO_TARGET_DIR/debug/providence-cli.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build complete native bundle
        run: python tools/release/package.py --godot "${{ env.PROVIDENCE_GODOT_PATH }}" --target "${{ runner.temp }}/providence-target" --cache "${{ runner.temp }}/providence-cache" --output "${{ runner.temp }}/providence-release"
      - name: Native startup and music boundaries
        shell: bash
        run: |
          "$PROVIDENCE_GODOT_PATH" --headless --path godot --script res://tools/validate_startup_splash.gd
          "$PROVIDENCE_GODOT_PATH" --headless --path godot --script res://tools/validate_music_pcm.gd
      - name: Catalog browsing and script interaction boundaries
        shell: bash
        run: |
          for check in record_browsing economy_navigation battle_gallery step_pointer_selection current_map_filter native_json library_integrity editor_operation project_operations scenario_import_controller asset_preview_cache unified_assets action_step_workbench action_description_lifecycle script_workbench; do
            "$PROVIDENCE_GODOT_PATH" --headless --path godot --script "res://tools/validate_${check}.gd" > "$RUNNER_TEMP/${check}.log" 2>&1
            cat "$RUNNER_TEMP/${check}.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$RUNNER_TEMP/${check}.log"; then exit 1; fi
            grep -E 'PROVIDENCE_.*_OK' "$RUNNER_TEMP/${check}.log"
          done
          runtime="$RUNNER_TEMP/providence-release/bundle"
          if [[ "$RUNNER_OS" == "macOS" ]]; then runtime="$runtime/Providence.app/Contents/MacOS"; fi
          python tools/run-record-browsing-check.py --godot "$PROVIDENCE_GODOT_PATH" --bundle "$runtime" --output-root "$RUNNER_TEMP/catalog-browsing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Providence-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/providence-release/*.zip
            ${{ runner.temp }}/providence-release/*.tar.gz
            ${{ runner.temp }}/providence-release/*.sha256

  release:
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Find successful builds of this exact revision
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/native-release.yml/runs" -f head_sha="$GITHUB_SHA" -f status=success --jq '.workflow_runs | map(select(.event == "push" and .head_branch == "main")) | first | .id')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'This revision has no successful three-platform build.'; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.tested.outputs.run_id }}
          path: release
          merge-multiple: true
      - name: Verify archives and prepare corresponding source
        run: |
          cd release
          test -f Providence-${GITHUB_REF_NAME}-windows-x64.zip
          test -f Providence-${GITHUB_REF_NAME}-macos-universal.zip
          test -f Providence-${GITHUB_REF_NAME}-linux-x64.tar.gz
          cat *.sha256 | tr -d '\r' > SHA256SUMS
          sha256sum --check SHA256SUMS
          git -C .. archive --format=tar.gz --prefix=Providence-${GITHUB_REF_NAME}/ --output="$PWD/Providence-${GITHUB_REF_NAME}-source.tar.gz" HEAD
          sha256sum *-source.tar.gz >> SHA256SUMS
      - name: Publish beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip release/*.tar.gz release/SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" --prerelease --title "Providence $GITHUB_REF_NAME" --notes-file docs/public/beta-release.md
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip release/*.tar.gz release/SHA256SUMS --verify-tag --prerelease --title "Providence $GITHUB_REF_NAME" --notes-file docs/public/beta-release.md
          fi
