[package]
name = "stuffit"
version = "0.3.1"
edition = "2021"
authors = ["Ben Letchford <ben@letchford.cloud>"]
description = "StuffIt (.sit) archive parser, decompressor, and creator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/benletchford/stuffit-rs"
keywords = ["stuffit", "sit", "archive", "compression", "macintosh"]
categories = ["compression", "encoding", "parser-implementations"]
readme = "README.md"

[workspace]
members = []
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
stuffit = { path = ".", version = "0.3.1", default-features = false } # x-release-please-version

[dependencies]
log = "0.4"
thiserror = "2.0"
flate2 = "1.0"
encoding_rs = "0.8.35"
md5 = "0.7"
rayon = "1.10"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"


[features]
default = []
cli = []
