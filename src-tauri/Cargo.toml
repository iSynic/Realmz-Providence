[package]
name = "realmz-providence"
version = "0.1.21"
description = "Modern Realmz scenario editor and creator."
authors = ["Realmz Providence contributors"]
edition = "2021"

[lib]
name = "realmz_providence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
hex = "0.4"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
